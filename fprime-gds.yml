# This is a configuration file for the F´ GDS application.

# The command-line options specified here will be passed to the GDS when it is launched
# from the current directory. Entries with no associated values are passed as `--flags`
# and entries with associated values are passed as `--key <value>` pairs to the CLI
#
# Example:
#
# ```yaml
# command-line-options:
#   ip-client:
#   ip-port: 50055
# ```


command-line-options:
  # Drv.Udp talks to YAMCS directly; without this fprime-yamcs defaults to its tcp-fast-server bridge
  communication-selection: udp
  # 32-byte AES-256 key shared by the deployment's SdlsFileKeyManager and YAMCS (see README)
  yamcs-sdls-key-file: sdls.key
  # Replaces the default -p/-a; -k is relative to the binary's directory (build-artifacts/<platform>/<deployment>/bin)
  application-arguments: ["-p", "50000", "-a", "0.0.0.0", "-k", "../../../../sdls.key"]
